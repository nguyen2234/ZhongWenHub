name: Frontend Pull Request CI

on:
  pull_request:
    paths:
      - 'Fontend/**'
      - '.github/workflows/frontend-pr-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend Build, Lint & Unit Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript & Vite Production Build
        run: bun run build

      - name: Run Linter (oxlint)
        run: bun run lint

      - name: Run Unit Tests
        run: bun test src/tests

      - name: Note on Playwright E2E & Database Isolation
        run: |
          echo "Playwright E2E suites require a live isolated test database (ZhongWenHub_Test) and local backend service."
          echo "Per database safety architecture, DB-dependent E2E tests are executed in isolated test environments."

      - name: Optional Playwright E2E Tests (Isolated Test Runner Only)
        if: env.RUN_PLAYWRIGHT_E2E == 'true'
        run: |
          bunx playwright install --with-deps chromium
          bunx playwright test --project=desktop-1440

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure() && env.RUN_PLAYWRIGHT_E2E == 'true'
        with:
          name: playwright-report
          path: |
            Fontend/playwright-report/
            Fontend/test-results/
          retention-days: 14
