name: Frontend Pull Request CI

on:
  pull_request:
    paths:
      - 'Fontend/**'
      - '.github/workflows/frontend-pr-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Frontend Build, Lint, Unit & E2E Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Fontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript & Vite Production Build
        run: bun run build

      - name: Run Linter (oxlint)
        run: bun run lint

      - name: Run Unit Tests
        run: bun test src/tests

      - name: Install Playwright Browsers & OS Dependencies
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests (desktop-1440)
        run: bunx playwright test --project=desktop-1440

      - name: Upload Playwright Test Report on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            Fontend/playwright-report/
            Fontend/test-results/
          retention-days: 14
