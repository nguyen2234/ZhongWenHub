name: Backend CI & Automated Tests

on:
  push:
    branches:
      - 'main'
      - 'feature/**'
      - 'refactor/**'
      - 'integration/**'
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: .NET 10 Build, Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'YourStrong!Password123'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Password123' -C -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_SQLSERVER_CONNECTION_STRING: "Server=localhost,1433;Database=ZhongWenHub_Test;User Id=sa;Password=YourStrong!Password123;TrustServerCertificate=True;"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef tool
        run: dotnet tool install --global dotnet-ef

      - name: Restore dependencies
        run: dotnet restore Backend/ZhongWenHub.sln

      - name: Build solution (Release mode)
        run: dotnet build Backend/ZhongWenHub.sln --configuration Release --no-restore

      - name: Run Backend Unit Tests (Isolated in-memory)
        run: dotnet test Backend/tests/ZhongWenHub.UnitTests/ZhongWenHub.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=unit_tests.trx"

      - name: Initialize Isolated Test Database (ZhongWenHub_Test)
        run: |
          dotnet ef database update --project Backend/src/ZhongWenHub.Api/ZhongWenHub.Api.csproj --connection "$TEST_SQLSERVER_CONNECTION_STRING"

      - name: Run SQL Server Integration Tests (Isolated Test Container)
        run: dotnet test Backend/tests/ZhongWenHub.IntegrationTests/ZhongWenHub.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration_tests.trx"

      - name: Upload Test Results Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/TestResults/*.trx'
          retention-days: 14
