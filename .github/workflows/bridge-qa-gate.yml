name: AI Bridge QA Release Gate

on:
  pull_request:
    paths:
      - '.ai-collaboration/**'
      - '.github/workflows/bridge-qa-gate.yml'
      - 'scripts/ai_bridge/**'
      - 'requirements.txt'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate-gate:
    name: Evaluate QA Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Release Gate File Schema
        run: |
          python scripts/ai_bridge/validate_protocol.py release-gate .ai-collaboration/qa/release-gate.json

      - name: Verify Release Gate Evidence & Safety
        run: |
          python scripts/ai_bridge/verify_release_gate.py
